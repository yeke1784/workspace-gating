<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>全局工作空间：自上而下门控交互演示</title><style>
:root{font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;color:#202938;background:#f5f7fa}*{box-sizing:border-box}body{margin:0;padding:28px}.panel{max-width:1050px;margin:auto;background:white;border:1px solid #e0e4eb;border-radius:22px;padding:35px 38px;box-shadow:0 8px 30px #1b2d4a0b}h1{margin:0 0 10px;font-size:26px}.hint{color:#697586;font-size:15px;margin-bottom:29px}.control{margin-bottom:27px}.lab{display:flex;justify-content:space-between;align-items:center;font-size:21px;font-weight:600;margin-bottom:14px}.val{font-variant-numeric:tabular-nums;font-weight:400}input[type=range]{width:100%;accent-color:#478fd0;cursor:pointer;height:28px}.divider{border-top:1px solid #e8ebef;margin:29px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}.name{color:#6b7280;font-size:17px}.number{font-size:35px;font-weight:700;margin-top:9px;font-variant-numeric:tabular-nums}.bar{height:22px;border-radius:100px;background:#edf0f4;margin:24px 0 10px;overflow:hidden}.fill{height:100%;background:#4e9cdb;width:88.1%;transition:width .15s}.status{text-align:center;margin:16px auto 24px;font-size:17px}.buttons{display:flex;justify-content:center;gap:13px;flex-wrap:wrap}button{border:1px solid #cdd5e0;background:#fff;border-radius:30px;font-size:17px;padding:10px 19px;cursor:pointer;color:#233246}button:hover{background:#ebf3fa}.formula{text-align:center;color:#4b5868;margin-top:26px;font-size:17px}.foot{text-align:center;color:#768192;font-size:13px;margin-top:14px}@media(max-width:600px){body{padding:10px}.panel{padding:20px}h1{font-size:21px}.metrics{gap:4px}.name{font-size:12px}.number{font-size:24px}.lab{font-size:16px}}
</style></head><body><main class="panel"><h1>全局工作空间：自上而下的乘法门控</h1><div class="hint">移动滑块或点击下方按钮，观察下行调节如何影响相同的加工输入。</div><div class="control"><div class="lab"><label for="asc">上行输入 Σ<sup>asc</sup></label><span class="val" id="ascLabel">2.0</span></div><input id="asc" type="range" min="0" max="4" step="0.2" value="2"></div><div class="control"><div class="lab"><label for="desc">下行输入 Σ<sup>desc</sup></label><span class="val" id="descLabel">0.0</span></div><input id="desc" type="range" min="-5" max="5" step="0.2" value="0"></div><div class="divider"></div><section class="metrics"><div><div class="name">上行信号</div><div id="a" class="number">2.00</div></div><div><div class="name">调节系数 Φ</div><div id="p" class="number">1.00</div></div><div><div class="name">最终活动 S</div><div id="s" class="number">0.881</div></div></section><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">没有额外下行调节：Φ = 1。</div><div class="buttons"><button onclick="preset(-3)">抑制</button><button onclick="preset(0)">正常加工</button><button onclick="preset(3)">增强</button></div><div class="formula">S = sigmoid(Σ<sup>asc</sup> · Φ(Σ<sup>desc</sup>))</div><div class="foot">教学示例：Φ(x) = 2/(1+e<sup>−x</sup>)；不是原论文对特定网络的数值复现。无需联网。</div></main><script>
const asc=document.getElementById('asc'),desc=document.getElementById('desc');function update(){const a=+asc.value,d=+desc.value,p=2/(1+Math.exp(-d)),s=1/(1+Math.exp(-a*p));document.getElementById('ascLabel').textContent=a.toFixed(1);document.getElementById('descLabel').textContent=d.toFixed(1);document.getElementById('a').textContent=a.toFixed(2);document.getElementById('p').textContent=p.toFixed(2);document.getElementById('s').textContent=s.toFixed(3);document.getElementById('fill').style.width=(s*100)+'%';document.getElementById('status').textContent=d>.05?'当前为注意增强：工作空间提高加工输入的作用。':d<-.05?'当前为注意抑制：工作空间降低加工输入的作用。':'没有额外下行调节：Φ = 1。';}function preset(v){asc.value=2;desc.value=v;update()}asc.addEventListener('input',update);desc.addEventListener('input',update);update();</script></body></html>
